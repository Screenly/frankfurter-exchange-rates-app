---
syntax: manifest_v1
description: Daily currency exchange rates from central banks
icon: https://playground.srly.io/edge-apps/icons/frankfurter-exchange-rates.svg
author: Screenly, Inc.
categories:
- Finance
ready_signal: true
settings:
  amount:
    type: string
    default_value: '1'
    title: Amount
    optional: true
    help_text:
      properties:
        help_text: |
          How much of the base currency each rate is for. Leave it at 1 for
          "1 USD buys", or set 100 or 1000 where the base is worth little
          against the currencies shown. On a board priced the other way round
          it is how many units of each currency the figure is for.
        type: number
        display_order: 3
      schema_version: 1
  theme:
    type: string
    default_value: dark
    title: Theme
    optional: true
    help_text:
      properties:
        help_text: |
          Dark suits a lobby or a bar; light suits a bright hall or a window
          facing the street.
        options:
        - label: Dark
          value: dark
        - label: Light
          value: light
        type: select
        display_order: 6
      schema_version: 1
  base_currency:
    type: string
    default_value: USD
    title: Base Currency
    optional: true
    help_text:
      properties:
        type: string
        display_order: 2
        help_text: |
          The currency everything else is priced against, as a three letter code,
          e.g. USD, EUR or JPY. The board reads "1 USD buys". Any of the 165
          currencies the API quotes will do; frankfurter.dev/currencies lists them.
      schema_version: 1
  rate_direction:
    type: string
    default_value: buys
    title: Rates Shown As
    optional: true
    help_text:
      properties:
        type: select
        advanced: true
        display_order: 1
        help_text: |
          Which way round the board reads. A bureau quoting its own currency
          wants the second: "1 USD costs 155.20 JPY".
        options:
          - label: What one unit of the base buys
            value: buys
          - label: What each currency costs in the base
            value: costs
      schema_version: 1
  quote_currencies:
    type: string
    default_value: EUR,GBP,JPY,CHF,CNY,AUD
    title: Currencies Shown
    optional: true
    help_text:
      properties:
        type: string
        display_order: 4
        help_text: |
          Three letter codes separated by commas, in the order they should appear,
          e.g. USD,GBP,JPY,CHF. Up to twelve fit on a screen; the board lays them
          out and sizes them to the number given. 165 currencies are available.
      schema_version: 1
  trend_days:
    type: string
    default_value: '30'
    title: Trend
    optional: true
    help_text:
      properties:
        help_text: |
          How far back the line under each rate goes.
        options:
        - label: 7 days
          value: '7'
        - label: 30 days
          value: '30'
        - label: 90 days
          value: '90'
        - label: 1 year
          value: '365'
        type: select
        display_order: 5
      schema_version: 1
  on_error:
    type: string
    default_value: show
    title: When Rates Cannot Be Shown
    optional: true
    help_text:
      properties:
        type: select
        advanced: true
        display_order: 2
        help_text: |
          What a screen does when it cannot reach the rates and has none saved.
          Standing aside gives the time to whatever else is scheduled instead
          of holding the screen on a message the room cannot act on. Either
          way the screen keeps trying, and shows the board as soon as it can.
        options:
          - label: Show what went wrong
            value: show
          - label: Stand aside and let the screen move on
            value: skip
      schema_version: 1
  board_title:
    type: string
    default_value: ''
    title: Heading
    optional: true
    help_text:
      properties:
        type: string
        display_order: 1
        help_text: |
          The small line above the base currency, e.g. "Today's rates" or the name
          of the bureau. Defaults to "Exchange rates".
      schema_version: 1